
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>House Price Prediction</h1>

        <p>Enter the details of the house</p>

        <form method="POST" action="/predict">

            <!-- Area -->
            <label for="area">
                Area (sq. ft.):
            </label>

            <input type="number"
                   id="area"
                   name="area"
                   min="1"
                   placeholder="Enter area"
                   required>


            <!-- Bedrooms -->
            <label for="bedrooms">
                Number of Bedrooms:
            </label>

            <input type="number"
                   id="bedrooms"
                   name="bedrooms"
                   min="1"
                   placeholder="Enter bedrooms"
                   required>


            <!-- Bathrooms -->
            <label for="bathrooms">
                Number of Bathrooms:
            </label>

            <input type="number"
                   id="bathrooms"
                   name="bathrooms"
                   min="1"
                   placeholder="Enter bathrooms"
                   required>


            <!-- Stories -->
            <label for="stories">
                Number of Stories:
            </label>

            <input type="number"
                   id="stories"
                   name="stories"
                   min="1"
                   placeholder="Enter stories"
                   required>


            <!-- Parking -->
            <label for="parking">
                Parking Spaces:
            </label>

            <input type="number"
                   id="parking"
                   name="parking"
                   min="0"
                   placeholder="Enter parking spaces"
                   required>


            <!-- Submit -->
            <button type="submit">
                Predict Price
            </button>

        </form>


        <!-- Prediction Result -->
        {% if prediction is defined %}

        <div class="result">

            <h2>Predicted House Price</h2>

            <p>
                Rs. {{ "{:,.0f}".format(prediction) }}
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
